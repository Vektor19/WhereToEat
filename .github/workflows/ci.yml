name: CI

# Frontend gates for the Angular web app (web/).
#
# Runs the Step 26 quality gates on every push and pull request:
#   - npm run test:coverage  — unit suites with the coverage thresholds enforced
#                              (core: 90/85 statements/branches; app: 80/75). A breach
#                              fails the job (non-zero exit), so the `core` business-logic
#                              gate is enforced in CI as the step requires.
#   - npm run lint           — eslint (incl. module boundaries)
#   - npm run build          — production build of core + app
#   - npm run e2e            — Playwright. The consumer happy-path + axe a11y specs run
#                              headless and pass; the two authenticated journeys
#                              (rating-submit, admin portal/dashboard) skip cleanly because
#                              E2E_LIVE_STACK is unset here (see e2e/support/live-stack.ts).
#
# A separate live-stack job could bring up the deploy/ docker-compose environment
# (gateway + both API hosts + DB + Keycloak), set E2E_LIVE_STACK=1, and run the gated
# e2e journeys alongside the backend Testcontainers suites — out of scope for this job.

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage gates
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
